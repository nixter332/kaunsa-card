# Monthly refresh: on the 1st of each month (9:00 India time), the offers agent re-reads the
# pages in data/offer-sources.json, drops expired offers and adds new ones it's confident about.
# Then the terms watcher checks every card's issuer pages and PDFs for changes, and re-reads only
# the cards whose documents changed (a reward cut shows up as a rule change). It opens a pull request. You review it (the review notes are in the PR description) and merge;
# Vercel then updates the live app. Nothing goes live without your merge.
#
# Run it any time from GitHub: Actions → "Monthly offers refresh" → Run workflow.
# Needs the repository secret ANTHROPIC_API_KEY, and Settings → Actions → General →
# "Allow GitHub Actions to create and approve pull requests" switched on.

name: Monthly offers refresh

on:
  schedule:
    - cron: "30 3 1 * *" # 03:30 UTC = 09:00 IST on the 1st
  workflow_dispatch:
    inputs:
      perks:
        description: "Also re-read every card's own page for lasting perks (do this every few months)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: offers-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Drop expired offers
        run: npm run offers -- --prune

      - name: Read offer pages
        run: npm run offers -- --batch

      - name: Read card perks
        if: ${{ inputs.perks }}
        run: npm run offers -- --perks

      - name: Add the offers marked ready
        run: npm run offers -- --apply-ready

      - name: Check card terms for changes
        continue-on-error: true
        run: npm run extract -- --watch --apply-ready

      - name: Run tests and type check
        id: tests
        continue-on-error: true
        run: npm test && npx tsc --noEmit

      - name: Build the pull request description
        run: |
          {
            echo "Automatic refresh for $(date +'%B %Y'). **Review before merging**: check each added offer against its page, check any card rule changes against the card's terms, and delete anything that looks wrong in this PR before merging."
            echo
            if [ "${{ steps.tests.outcome }}" != "success" ]; then echo "> ⚠ Tests failed on this branch. Don't merge until they pass."; echo; fi
            echo "### What changed"
            echo
            git diff --stat -- data/offers.json data/cards.json || true
            echo
            for f in data/proposed/REVIEW-terms.md data/proposed/REVIEW-offers.md data/proposed/REVIEW-perks.md; do
              if [ -f "$f" ]; then echo; cat "$f"; fi
            done
          } > pr-body.md
          # GitHub limits PR descriptions to 65,536 characters.
          head -c 60000 pr-body.md > pr-body-trimmed.md

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: offers/monthly-refresh
          delete-branch: true
          add-paths: |
            data/offers.json
            data/cards.json
            data/terms-watch.json
          commit-message: "Monthly offers and card terms refresh"
          title: "Monthly refresh: review and merge"
          body-path: pr-body-trimmed.md
          labels: ${{ steps.tests.outcome != 'success' && 'tests-failing' || '' }}
